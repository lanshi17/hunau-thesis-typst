name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v3
        with:
          typst-version: 0.15.1

      - name: Install fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra poppler-utils

      - name: Check CJK fonts
        run: |
          typst fonts > /tmp/fonts.txt
          grep -E 'Noto (Sans|Serif) CJK' /tmp/fonts.txt

      - name: Use Noto CJK fonts in CI
        run: |
          sed -i 's/"SimSun"/"Noto Serif CJK SC"/g' hunau.typ
          sed -i 's/"SimHei"/"Noto Sans CJK SC"/g' hunau.typ
          sed -i 's/"Xingkai SC"/"Noto Serif CJK SC"/g' hunau.typ

      - name: Compile thesis
        run: typst compile main.typ

      - name: Check page count
        run: |
          pages=$(pdfinfo main.pdf | awk '/Pages/ {print $2}')
          echo "pages: $pages"
          if [ "$pages" -lt 20 ]; then
            echo "page count looks too small: $pages"
            exit 1
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: hunau-thesis-typst
          path: main.pdf
